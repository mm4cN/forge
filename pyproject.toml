[project]
license = "MIT"
authors = [
  { name = "mm4cN" }
]
name = "forge"
version = "0.1.0"
description = "Local LLM forge CLI using Ollama"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "requests>=2.31.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
forge = "forge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
