[project]
name = "forge"
version = "0.1.0"
description = "Local LLM forge CLI using Ollama"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "requests>=2.31.0",
]

[project.scripts]
forge = "forge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
